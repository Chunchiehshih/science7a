<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>國中學習網</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='2' y='10' width='36' height='20' rx='4' fill='%23ffffff' stroke='%231B2733' stroke-width='2'/%3E%3Crect x='3' y='11' width='9' height='18' rx='3' fill='%23E8EEEF'/%3E%3Ccircle cx='25' cy='20' r='6' fill='%232350A8'/%3E%3C/svg%3E">
<style>
  :root { --bg: #F3F6F6; --card: #FFFFFF; --ink: #1B2733; --ink-2: #4A5866; --line: #C9D3D6; --accent: #2350A8; --accent-ink: #FFFFFF; --bad: #B3261E; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #10171D; --card: #18222B; --ink: #E8EEF2; --ink-2: #A9B6C0; --line: #33424E; --accent: #8FB0F0; --accent-ink: #10171D; --bad: #F2A39C; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 18px/1.6 -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; display: flex; align-items: center; justify-content: center; padding: 16px; }
  main { width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: var(--ink-2); }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=password], input[type=text] { width: 100%; font-size: 22px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 10px; background: transparent; color: var(--ink); letter-spacing: .06em; }
  input:focus { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .show { display: flex; align-items: center; gap: 8px; margin: 10px 0 18px; font-size: 16px; color: var(--ink-2); font-weight: 400; }
  .show input { width: 20px; height: 20px; }
  button { width: 100%; font-size: 20px; font-weight: 700; padding: 12px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #msg { min-height: 1.6em; margin: 14px 0 0; color: var(--ink-2); }
  #msg.bad { color: var(--bad); font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>國中學習網</h1>
  <form id="f" hidden autocomplete="off">
    <p>請輸入老師給的密碼。這台裝置輸入一次之後就會記住。</p>
    <label for="pw">密碼</label>
    <input id="pw" type="password" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go">
    <label class="show"><input id="see" type="checkbox"> 顯示密碼</label>
    <button id="go" type="submit">進入</button>
  </form>
  <p id="msg" role="status" aria-live="polite">正在打開學習網…</p>
  <noscript><p class="bad">請開啟 JavaScript 才能使用學習網。</p></noscript>
</main>
<script>
(function () {
  'use strict';
  var CFG = {"bin":"app-index.3db18d839e.bin","salt":"WesRtgceiV3zuSJew49x1Q==","iter":400000,"wrapIv":"4Doj/m/k8o5xHsbD","wrapped":"tchFNtgGGfHxpiq1c7Asc0GuJBgJRvSP4t5a0R6NWFQBek9yA5+z4qZO7IsT+LaL","keyId":"f85e34ebbd27","page":"index.html"};
  var LS = 'sci7a:gate';
  var f = document.getElementById('f'), pw = document.getElementById('pw'), go = document.getElementById('go'), msgEl = document.getElementById('msg');
  function msg(t, bad) { msgEl.textContent = t; msgEl.className = bad ? 'bad' : ''; }
  function b64d(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64e(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  // 大小寫、全形半形、空白都不影響（和 protect-site.mjs 的 normPw 相同）
  function norm(p) { return String(p || '').normalize('NFKC').replace(/\s+/g, '').toUpperCase(); }
  var subtle = window.crypto && window.crypto.subtle;
  if (!subtle || typeof DecompressionStream === 'undefined' || !window.fetch || !window.TextEncoder) {
    msg('這台裝置的瀏覽器太舊，打不開學習網。請把 iPad 更新到 iPadOS 16.4 以上再試。', true);
    return;
  }
  var binP = null;
  function getBin() {
    if (!binP) {
      binP = fetch(CFG.bin).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); });
      binP.catch(function () { binP = null; });   // 失敗就下次重抓
    }
    return binP;
  }
  getBin();   // 先在背景下載，輸入密碼時就準備好了
  function remembered() {
    try { var v = JSON.parse(localStorage.getItem(LS) || 'null'); if (v && v.id === CFG.keyId && v.k) return b64d(v.k); } catch (e) { /* 忽略 */ }
    return null;
  }
  function remember(raw) { try { localStorage.setItem(LS, JSON.stringify({ id: CFG.keyId, k: b64e(raw) })); } catch (e) { /* 存不了就下次再輸入 */ } }
  function forget() { try { localStorage.removeItem(LS); } catch (e) { /* 忽略 */ } }

  /** 用內容金鑰解開整頁；網路錯誤的 code 是 'net'，金鑰不對是 'key' */
  function openWith(raw) {
    var keyP = subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    return Promise.all([keyP, getBin().catch(function (e) { e.code = 'net'; throw e; })]).then(function (r) {
      var u = new Uint8Array(r[1]);
      if (u.length < 32 || u[0] !== 83 || u[1] !== 67 || u[2] !== 73 || u[3] !== 49) { var e = new Error('bad-bin'); e.code = 'net'; throw e; }
      return subtle.decrypt({ name: 'AES-GCM', iv: u.subarray(4, 16) }, r[0], u.subarray(16)).catch(function (e) { e = new Error('bad-key'); e.code = 'key'; throw e; });
    }).then(function (gz) {
      var stream = new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(stream).text();
    });
  }
  function render(html) { document.open(); document.write(html); document.close(); }
  function unwrap(p) {
    return subtle.importKey('raw', new TextEncoder().encode(norm(p)), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return subtle.deriveKey({ name: 'PBKDF2', salt: b64d(CFG.salt), iterations: CFG.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    }).then(function (kek) {
      return subtle.decrypt({ name: 'AES-GCM', iv: b64d(CFG.wrapIv) }, kek, b64d(CFG.wrapped));
    }).then(function (raw) { return new Uint8Array(raw); });
  }
  function showForm(text, bad) {
    f.hidden = false; go.disabled = false;
    msg(text || '', bad);
    try { pw.focus(); } catch (e) { /* 忽略 */ }
  }
  function netFail() { showForm('下載學習網失敗，請確認網路連線後再按「進入」。', true); }

  document.getElementById('see').addEventListener('change', function () { pw.type = this.checked ? 'text' : 'password'; });
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!norm(pw.value)) { msg('請輸入密碼。', true); return; }
    go.disabled = true; msg('確認密碼中…');
    unwrap(pw.value).then(function (raw) {
      msg('密碼正確，正在打開學習網…');
      return openWith(raw).then(function (html) { remember(raw); render(html); }, function (e) {
        if (e && e.code === 'net') netFail(); else showForm('網站檔案和密碼對不上，請重新整理頁面再試。', true);
      });
    }, function () {
      go.disabled = false; msg('密碼不對，請再試一次。', true);
      try { pw.select(); } catch (e) { /* 忽略 */ }
    });
  });

  var k = remembered();
  if (k) {
    openWith(k).then(render, function (e) {
      if (e && e.code === 'net') netFail();
      else { forget(); showForm('老師換了新密碼，請重新輸入。', true); }
    });
  } else {
    showForm('');
  }
})();
</script>
</body>
</html>
